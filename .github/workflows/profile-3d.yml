name: GitHub-Profile-3D-Contrib

on:
  schedule: # Atualiza diariamente (18:00 UTC)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      # O GITHUB_TOKEN padrão só tem acesso ao repositório deste workflow.
      # Para incluir atividades de organizações com repositórios privados,
      # configure PROFILE_CONTRIBUTIONS_TOKEN conforme .github/PROFILE_CONTRIBUTIONS.md.
      - name: Check private contribution access
        env:
          PROFILE_CONTRIBUTIONS_TOKEN: ${{ secrets.PROFILE_CONTRIBUTIONS_TOKEN }}
        run: |
          if [ -z "$PROFILE_CONTRIBUTIONS_TOKEN" ]; then
            echo "::warning::PROFILE_CONTRIBUTIONS_TOKEN não configurado; contribuições privadas de organizações podem não aparecer no mapa."
          fi

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_CONTRIBUTIONS_TOKEN || github.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "Mapa 3D já está atualizado."
          else
            git commit -m "chore: update 3D contribution map"
            git push
          fi
